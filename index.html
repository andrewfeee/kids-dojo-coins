<style>

body{margin:0;min-height:100vh;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;color:#1d1b4b;
 background:linear-gradient(180deg,#4cc9f0 0%,#8ee3f7 60%,#b8f2a6 100%);overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.cloud{position:fixed;background:#fff;border-radius:50px;opacity:.75;z-index:0}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:14rem;height:4rem;top:3rem;left:8%}.c1:before{width:6rem;height:6rem;top:-3rem;left:2rem}.c1:after{width:5rem;height:5rem;top:-2rem;left:7rem}
.c2{width:12rem;height:3.5rem;top:6rem;right:12%}.c2:before{width:5rem;height:5rem;top:-2.5rem;left:2rem}.c2:after{width:4rem;height:4rem;top:-1.6rem;left:6rem}

header{display:flex;align-items:center;margin-bottom:1rem}

 background:radial-gradient(circle at 35% 30%,#fff7b0 0 12%,#ffd23f 30%,#f4a100 75%,#c77a00 100%);box-shadow:0 .2rem 0 #a86400}

 background:#7b2cbf;box-shadow:0 .35rem 0 #4a1677;transition:transform .12s,box-shadow .12s;outline:none;white-space:nowrap}

.btn:disabled{opacity:.45}
:focus{outline:none}
.nav:focus,.nav.kbd-focus{transform:scale(1.07);box-shadow:0 0 0 .4rem #fff,0 0 0 .8rem #ffbe0b,0 .6rem 1.2rem rgba(0,0,0,.35)!important;z-index:5;position:relative}

#board{flex:1;display:flex;flex-direction:column}
.kidrow{flex:1;display:grid;grid-template-columns:23rem 1fr;grid-gap:1rem;background:rgba(255,255,255,.55);border-radius:2rem;padding:1rem;margin-bottom:1rem;
 border:.35rem solid #fff;box-shadow:0 .5rem 1.2rem rgba(0,0,0,.12)}
.kidpanel{border-radius:1.5rem;padding:.8rem;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:#fff;position:relative}
.kidtop{display:flex;align-items:center;width:100%}

.pts{font-size:1.2rem;margin-left:.8rem;opacity:.95}

.pilecv{width:100%;flex:1;min-height:8rem;display:block}
.lifetime{font-size:1.25rem;font-weight:bold;background:rgba(0,0,0,.18);border-radius:1rem;padding:.25rem .8rem}
.bonus{font-size:1.3rem;padding:.5rem 1rem;margin:0;background:#ffbe0b;color:#3d2a00;box-shadow:0 .3rem 0 #b88600}

.weekwrap{height:100%}
.week{height:100%;display:grid;grid-template-columns:7.5rem repeat(7,1fr);grid-template-rows:2.6rem 1fr 1fr;grid-gap:.6rem}

 box-shadow:0 .3rem 0 #c9c3e6;transition:transform .12s;min-height:5.5rem;line-height:1.15;text-align:center;word-break:break-word}

/* running animals: a small animal wanders a maze along the margins and gaps between board cells. On any stretch where it would
   touch a job, booking, label or button it ducks BEHIND the board (z-index under #app), so it never covers them */
#critter{position:fixed;left:0;top:0;width:42px;height:32px;z-index:40;pointer-events:none;display:none;will-change:transform;transition-property:transform;transition-timing-function:linear}
#critter.on{display:block}
/* v4.3: animals and riders run IN FRONT of everything on the page (z 40), under only the full-screen layers (modal, Settings, keypad: z 50).
   pointer-events:none so clicks, D-pad focus and the focus ring are never blocked; it fades while crossing the focused job. */
#critter{transition-property:transform,opacity}#critter.near{opacity:.45}
#critter .cIn{width:100%;height:100%;transition:transform .15s}
#critter.left .cIn{transform:scaleX(-1)}
#critter svg{width:100%;height:100%;display:block;overflow:visible}
#critter .fb{visibility:hidden}
#critter.moving .fa{animation:legA .26s steps(1) infinite}#critter.moving .fb{animation:legB .26s steps(1) infinite}
#critter.moving .bd{animation:bob .26s steps(1) infinite}
#critter.moving[data-animal="chook"] .fa,#critter.moving[data-animal="chook"] .fb,#critter.moving[data-animal="chook"] .bd{animation-duration:.16s}
#critter.sniff .bd{animation:sniff .5s ease-in-out infinite;transform-origin:70% 60%}
@keyframes legA{0%{visibility:visible}50%{visibility:hidden}}
@keyframes legB{0%{visibility:hidden}50%{visibility:visible}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes sniff{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg) translateY(1.5px)}}
/* RIDERS-CSS-BEGIN */
#critter.rider{width:80px;height:34px}
#critter .hd{animation:wobble .9s ease-in-out infinite}
#critter .wh{animation:spin .35s linear infinite}
#critter .bk{animation:bounce .3s ease-in-out infinite}
#critter .pt{opacity:0;transform-box:fill-box;transform-origin:center}
#critter.moving .dirt .pt{animation:dirt 1s linear infinite}
#critter.moving .dust .pt{animation:dust 1.3s ease-out infinite}
#critter:not(.moving) .wh,#critter:not(.moving) .bk{animation-play-state:paused}
@keyframes wobble{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
@keyframes dirt{0%{opacity:1;transform:translate(0,0) scale(.6)}60%{opacity:.75}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.5)}}
@keyframes dust{0%{opacity:.95;transform:translate(0,0) scale(.5)}55%{opacity:.7}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(2.2)}}
/* RIDERS-CSS-END */
/* v4.4: large brick-arch portals, hung off the extreme screen corners so only the
   mouth shows. The opening is tall enough for every animal and rider (with helmet) plus
   headroom. Back (dark mouth) under the runner, front lip over it. */
#tunTL-back,#tunBR-back,#tunTL-front,#tunBR-front{
  position:fixed;left:0;top:0;width:132px;height:106px;pointer-events:none;display:none;
}
#tunTL-back.on,#tunBR-back.on,#tunTL-front.on,#tunBR-front.on{display:block}
#tunTL-back,#tunBR-back{z-index:39}
#tunTL-front,#tunBR-front{z-index:41}
#tunTL-back svg,#tunBR-back svg,#tunTL-front svg,#tunBR-front svg{width:100%;height:100%;display:block;overflow:visible}
@media (prefers-reduced-motion:reduce){#tunTL-back,#tunBR-back,#tunTL-front,#tunBR-front{display:none!important}}

#critter .hf{transform-box:fill-box;transform-origin:center}
#critter.left .hf{transform:scaleX(-1)}
@media (prefers-reduced-motion:reduce){#critter{display:none!important}}

var KEY = "kidsDojo.v1";
var DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var DAYS_LONG = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var AM_DEFAULT = ["Stack dishwasher","Sort laundry","Pack lunch"];
var PM_DEFAULT = ["","Homework / reading","Tidy room"];
var DAILY_PM = "Unpack bag"; /* every kid, every afternoon, alongside their other afternoon job */
/* per-job coin values (by job name, any kid/day); anything not listed earns the Settings default */
var TASK_VALUE_SEED = {"stack dishwasher":5,"pack lunch":7,"pack lunches":7,"sort laundry":2,"feed chooks":6,"unpack bag":1};
var COLOURS = ["#3a86ff","#f15bb5","#ffc93c","#2bb673","#ff8c1a","#7b2cbf","#e63946"]; // Charlie blue, Pip pink, Jack yellow
var MAX_KIDS = 4;

/* ---------- dates ---------- */
function mondayOf(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function ymd(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function todayIdx(){ return (new Date().getDay()+6)%7; }
function weekKey(){ return ymd(mondayOf(new Date())); }

/* ---------- state ---------- */
/* a slot may hold several jobs, written "Tidy room + Unpack bag"; job i in a slot has key day+slot+(i||"") e.g. "3pm", "3pm1" */
function splitJobs(s){ return String(s||"").split(/\s*\+\s*/).map(function(x){ return x.trim(); }).filter(Boolean); }
function joinJobs(a){ return a.filter(function(x){ return x&&x.trim(); }).join(" + "); }
function parseKey(key){ var m=/^(\d)(am|pm)(\d*)$/.exec(key||""); return m?{d:+m[1],s:m[2],i:m[3]?+m[3]:0}:null; }
function jobOfKey(k,key){ var p=parseKey(key); if(!p) return ""; return splitJobs((k.tasks[p.d]||{})[p.s])[p.i]||""; }
function defaultTasks(offset){
  var t=[]; for(var i=0;i<7;i++){ var am=AM_DEFAULT[(i+offset)%3]; if(i>=5&&am==="Pack lunch") am="Feed chooks"; t.push({am:am, pm:joinJobs([PM_DEFAULT[(i+offset)%3],DAILY_PM])}); } return t;
}
function newKid(i,name){
  return {id:"k"+Date.now().toString(36)+i, name:name, photo:null, avatarIdx:i%DEFAULT_AVATARS.length, colour:COLOURS[i%COLOURS.length], lifetime:0, tasks:defaultTasks(i)};
}
function defaultBookings(){ return []; }
function freshState(){
  var kids=[newKid(0,"Charlie"),newKid(1,"Pip"),newKid(2,"Jack")];
  return {v:7, taskValues:JSON.parse(JSON.stringify(TASK_VALUE_SEED)), kids:kids, week:weekKey(), done:{}, bonus:{}, history:[], log:{}, view:"week", sound:true, autoReset:true, bookings:[], coinValue:5, ledger:[], items:defaultItems(), pledges:{}, purchases:[]};
}
var S;
var FIRST_RUN=false;
function hashView(){ var h=(location.hash||"").toLowerCase(); return h==="#rewards"?"rewards":h==="#market"?"market":h==="#history"?"history":"week"; }
function load(){
  var raw=null; try{ raw=localStorage.getItem(KEY); }catch(e){}
  FIRST_RUN=!raw;
  try{ S=JSON.parse(raw); }catch(e){ S=null; }
  if(!S||!S.kids||!S.kids.length){ S=freshState(); }
  S.done=S.done||{}; S.bonus=S.bonus||{}; S.history=S.history||[]; S.view="week"; // Week is always the main view on load
  // upgrade old 2-kid default (Charlie + "Kid 2") to Charlie, Pip, Jack
  if(S.kids.length===2&&S.kids[1].name==="Kid 2"&&!S.kids[1].photo){ S.kids[1].name="Pip"; S.kids.push(newKid(2,"Jack")); save(); }
  if(!S.log){ S.log={}; migrateLog(); }
  if(!S.bookings){ S.bookings=[]; }
  S.bookings=S.bookings.filter(function(b){ return b && b.id!=="bseedtennis"; });
  if((S.v||0)<4){ // v4: Skylight-style colours (Charlie blue, Pip pink, Jack yellow)
    S.kids.forEach(function(k){ if(String(k.name).toLowerCase()==="jack"&&k.colour==="#2bb673") k.colour="#ffc93c"; });
  }
  if(S.layout!=="all") S.layout="split";
  S.view=hashView();
  migrateEconomy(false); migrateTaskValues(); migrateDailyPm(); S.ledger=S.ledger||[]; S.items=S.items||[]; S.pledges=S.pledges||{}; S.purchases=S.purchases||[];
  S.v=7; save();
  checkWeek();
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast("Couldn't save – storage full? Try a smaller photo."); }
}
function checkWeek(){
  var wk=weekKey();
  if(S.week!==wk){
    if(S.autoReset){ S.done={}; S.bonus={}; S.history=[]; }
    S.week=wk; save();
  }
}
/* log: { "YYYY-MM-DD": { kidId: {am:bool, pm:bool, bonus:n} } } — keeps a day-by-day record (used to show past weeks) */
var WEEK_OFF=0; /* 0 = this week; -1 last week; +1 next week (main screen only) */
function viewMonday(){ var x=mondayOf(new Date()); x.setDate(x.getDate()+7*WEEK_OFF); return x; }
function vDateOfIdx(d){ var x=viewMonday(); x.setDate(x.getDate()+d); return ymd(x); }
function dateOfIdx(d){ var x=mondayOf(new Date()); x.setDate(x.getDate()+d); return ymd(x); }
function logGet(date,kid,create){ var L=S.log[date]; if(!L){ if(!create) return null; L=S.log[date]={}; } var e=L[kid]; if(!e&&create) e=L[kid]={am:false,pm:false,bonus:0}; return e; }
function logTask(kid,key,val){ var e=logGet(dateOfIdx(+key[0]),kid,true); e[key.slice(1)]=val; }
function logBonus(kid,date,delta){ var e=logGet(date,kid,true); e.bonus=Math.max(0,(e.bonus||0)+delta); }
function migrateLog(){ for(var kid in S.done){ for(var key in S.done[kid]) if(S.done[kid][key]) logTask(kid,key,true); } for(var kid2 in S.bonus){ if(S.bonus[kid2]) logBonus(kid2,ymd(new Date()),S.bonus[kid2]); } }
function kidById(id){ for(var i=0;i<S.kids.length;i++) if(S.kids[i].id===id) return S.kids[i]; return null; }
function weekCoinsLogged(k,mon){ var n=0; for(var i=0;i<7;i++){ var d=new Date(mon); d.setDate(mon.getDate()+i); var e=logGet(ymd(d),k.id,false); if(e) n+=e.coins!=null?e.coins:((e.am?1:0)+(e.pm?1:0)+(e.bonus||0))*5; } return n; }
function weekPoints(k){
  var d=S.done[k.id]||{}, n=0; for(var key in d) if(d[key]) n+=(d[key]===true?coinValue():+d[key]||0);
  return n+(S.bonus[k.id]||0);
}
function avatarSrc(k){ return k.photo || DEFAULT_AVATARS[k.avatarIdx||0] || DEFAULT_AVATARS[0]; }

/* ---------- helpers ---------- */
function el(tag,cls,html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function iconFor(t){
  t=(t||"").toLowerCase();
  var map=[["dish","🍽️"],["laundry","🧺"],["wash","🧼"],["lunch","🥪"],["bag","🎒"],["home","📚"],["read","📚"],["tidy","🧸"],["room","🧸"],["bed","🛏️"],["teeth","🪥"],["dog","🐶"],["cat","🐱"],["feed","🥣"],["bin","🗑️"],["rubbish","🗑️"],["shower","🚿"],["bath","🛁"],["practice","🎵"],["piano","🎹"],["table","🍴"],["shoe","👟"],["uniform","👕"],["dress","👕"],["water","💧"],["plant","🌱"]];
  for(var i=0;i<map.length;i++) if(t.indexOf(map[i][0])>=0) return map[i][1];
  return "⭐";
}
function bookingIcon(t){
  t=(t||"").toLowerCase();
  var map=[["tennis","🎾"],["swim","🏊"],["pool","🏊"],["nippers","🏖️"],["surf","🏄"],["sail","⛵"],["footy","🏉"],["afl","🏉"],["soccer","⚽"],["football","⚽"],["rugby","🏉"],["cricket","🏏"],["netball","🏐"],["basketball","🏀"],["ballet","🩰"],["dance","💃"],["gymnast","🤸"],["karate","🥋"],["judo","🥋"],["taekwondo","🥋"],["piano","🎹"],["violin","🎻"],["strings","🎻"],["guitar","🎸"],["choir","🎤"],["music","🎵"],["drama","🎭"],["art","🎨"],["athletics","🏃"],["running","🏃"],["horse","🐴"],["riding","🐴"],["homework","📚"],["study","📚"],["doctor","🩺"],["dentist","🦷"],["hospital","🏥"],["haircut","✂️"],["party","🎉"],["birthday","🎂"],["church","⛪"],["scouts","🏕️"],["guides","🏕️"],["lesson","📘"],["tutor","📘"],["tuition","📘"],["training","🏅"],["practice","🏅"],["playdate","🧸"],["sleepover","🌙"],["appointment","📅"]];
  for(var i=0;i<map.length;i++) if(t.indexOf(map[i][0])>=0) return map[i][1];
  return "📅";
}
function parseTime(s){
  var m=/^(\d{1,2}):(\d{2})$/.exec(String(s||"").trim());
  var h=m?+m[1]:8, min=m?+m[2]:30;
  if(h<0) h=0; if(h>23) h=23; if(min<0) min=0; if(min>59) min=59;
  return {h:h,min:min};
}
function padTime(s){ var t=parseTime(s); return ("0"+t.h).slice(-2)+":"+("0"+t.min).slice(-2); }
function fmtClock(s, withPeriod){
  var t=parseTime(s), h=t.h%12; if(!h) h=12;
  var out=String(h);
  if(t.min) out+=":"+("0"+t.min).slice(-2);
  if(withPeriod) out+=(t.h<12?"am":"pm");
  return out;
}
function fmtTime(s){ return fmtClock(s, true); }
function fmtTimeRange(start, end){
  if(!end) return fmtTime(start);
  var a=parseTime(start), b=parseTime(end);
  if((a.h<12)===(b.h<12)) return fmtClock(start, false)+"–"+fmtTime(end);
  return fmtTime(start)+"–"+fmtTime(end);
}
function timeMinutes(s){ var t=parseTime(s); return t.h*60+t.min; }
function isAmTime(s){ return timeMinutes(s)<12*60; }
function bookingLabel(b){ return bookingIcon(b.title)+" "+(b.title||"Booking")+" "+fmtTimeRange(b.time, b.end); }
function dateFromYmd(s){ var p=String(s||"").split("-"); return new Date(+p[0]||2000,(+p[1]||1)-1,+p[2]||1); }
function weekdayOfYmd(s){ return (dateFromYmd(s).getDay()+6)%7; }
function bookingsOn(kidId, dateStr){
  var wd=weekdayOfYmd(dateStr), out=[];
  (S.bookings||[]).forEach(function(b){
    if(!(b.kid==="all"||b.kid===kidId)) return;
    if(b.recur==="weekly"){ if(+b.weekday===wd) out.push(b); }
    else if(b.date===dateStr) out.push(b);
  });
  out.sort(function(a,c){ return timeMinutes(a.time)-timeMinutes(c.time)||String(a.title||"").localeCompare(c.title||""); });
  return out;
}
function bookingsOnSlot(kidId, dateStr, slot){
  return bookingsOn(kidId, dateStr).filter(function(b){ return isAmTime(b.time)?slot==="am":slot==="pm"; });
}
function bookingsOnDate(dateStr){
  var seen={}, out=[];
  (S.kids||[]).forEach(function(k){
    bookingsOn(k.id, dateStr).forEach(function(b){ if(!seen[b.id]){ seen[b.id]=1; out.push(b); } });
  });
  out.sort(function(a,c){ return timeMinutes(a.time)-timeMinutes(c.time); });
  return out;
}
function bookingWhoName(b){
  if(b.kid==="all") return "Whole family";
  var k=kidById(b.kid); return k?k.name:"(removed)";
}
function bookingWhenText(b){
  if(b.recur==="weekly") return "every "+DAYS_LONG[+b.weekday||0];
  var d=dateFromYmd(b.date||ymd(new Date()));
  return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();
}

/* ---------- coin pile ---------- */
var PILE_CAP=1e9, layoutCache={}; /* exact: one coin drawn per coin; big piles get more, smaller coins */
function pileStacks(n){ return Math.max(7, 2*Math.round(Math.sqrt(n/6))+1); }
function pileLayout(n){
  if(layoutCache[n]) return layoutCache[n];
  var ST=pileStacks(n), hgt=[],pos=[],c=(ST-1)/2,i,k; for(i=0;i<ST;i++) hgt.push(0);
  for(k=0;k<n;k++){
    var best=-1,bs=1e9;
    for(i=0;i<ST;i++){ var s=hgt[i]+1.7*Math.abs(i-c)*(9/ST)*1.0+(i<c?0.01:0); if(s<bs){bs=s;best=i;} }
    pos.push({s:best-c,l:hgt[best],j:((k*37)%7-3)/3,r:((k*53)%9-4)/4}); hgt[best]++;
  }
  var keys=Object.keys(layoutCache); if(keys.length>40) layoutCache={};
  return (layoutCache[n]=pos);
}
function drawCoinFlat(ctx,x,y,w){
  var hh=w*0.36, th=w*0.16;
  ctx.fillStyle="#b86e00"; ctx.beginPath(); ctx.ellipse(x,y+th,w/2,hh/2,0,0,Math.PI*2); ctx.fill();
  ctx.fillRect(x-w/2,y,w,th);
  ctx.fillStyle="#e39b00"; ctx.fillRect(x-w/2,y,w,th*0.55);
  var g=ctx.createLinearGradient(x-w/2,y-hh/2,x+w/2,y+hh/2); g.addColorStop(0,"#fff3a0"); g.addColorStop(.45,"#ffd23f"); g.addColorStop(1,"#f2a300");
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y,w/2,hh/2,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="rgba(150,90,0,.55)"; ctx.lineWidth=Math.max(1,w*0.04); ctx.beginPath(); ctx.ellipse(x,y,w*0.34,hh*0.32,0,0,Math.PI*2); ctx.stroke();
}
function pileGeom(cw,ch,n){
  var pos=pileLayout(Math.max(1,n||1)), span=0, ml=1;
  pos.forEach(function(p){ span=Math.max(span,Math.abs(p.s)); ml=Math.max(ml,p.l+1); });
  span=Math.max(span,1.5); ml=Math.max(ml,3);
  var w=Math.min(cw/(2*span*0.8+1.4), ch/(ml*0.16+0.8), cw/4.2); return {w:w, th:w*0.16, cx:cw/2, base:ch-w*0.36};
}
function coinPos(p,g){ return {x:g.cx+p.s*g.w*0.8+p.j*g.w*0.06, y:g.base-p.l*g.th - g.w*0.1}; }
function drawPile(ctx,n,cw,ch,opt){
  opt=opt||{};
  var g=pileGeom(cw,ch,opt.geomN||n), pos=pileLayout(n);
  // shadow
  ctx.fillStyle="rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(g.cx,g.base+g.w*0.15,Math.min(cw*0.48,g.w*4.3),g.w*0.35,0,0,Math.PI*2); ctx.fill();
  var order=pos.map(function(p,i){return i;}).sort(function(a,b){ return pos[a].l-pos[b].l || Math.abs(pos[b].s)-Math.abs(pos[a].s); });
  for(var i=0;i<order.length;i++){ var pp=pos[order[i]], c=coinPos(pp,g); if(pp.r){ ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(pp.r*0.1); drawCoinFlat(ctx,0,0,g.w); ctx.restore(); } else drawCoinFlat(ctx,c.x,c.y,g.w); }
  if(n===0 && !opt.noEmpty){ ctx.fillStyle="rgba(255,255,255,.85)"; ctx.font="bold "+Math.round(Math.min(ch*0.15,cw/13))+"px Trebuchet MS, sans-serif"; ctx.textAlign="center"; ctx.fillText("No coins yet – let's go!",cw/2,ch*0.55,cw*0.95); }
  return g;
}
function nextCoinTarget(n,cw,ch){ // position the n-th coin (1-based) lands at
  var g=pileGeom(cw,ch,n), pos=pileLayout(n); var p=pos[Math.min(n,PILE_CAP)-1]; if(!p) return {x:g.cx,y:g.base,w:g.w};
  var c=coinPos(p,g); c.w=g.w; return c;
}
function paintPileCanvas(cv,n){
  var r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  if(!r.width) return;
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  var ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
  drawPile(ctx,n,r.width,r.height);
}

var PAGE=null; // "wd" (Mon–Fri) | "we" (Sat–Sun) when the main screen is split
function pageDays(){
  if(S.layout==="all") return [0,1,2,3,4,5,6];

  return PAGE==="we"?[5,6]:[0,1,2,3,4];
}
function inkFor(hex){ var n=parseInt(String(hex).slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255; return (0.299*r+0.587*g+0.114*b)>165?"#1d1b4b":"#fff"; }

function setView(v){

    :"Arrows to move &middot; OK/Enter to tick a job"+(split?(PAGE==="wd"?" &middot; ▶ past Friday: weekend &middot; ◀ before Monday: last week":" &middot; ◀ before Saturday: Mon–Fri &middot; ▶ past Sunday: next week"):" &middot; ◀ ▶ at the edges: other weeks")+" &middot; finish a job to earn a coin!";
  if(S.view==="rewards") renderRewards();

/* extra jobs make cells taller: shrink job/booking text a step at a time until the board fits */
function fitBoard(){
  var b=document.getElementById("board"); if(!b) return; b.style.removeProperty("--tk"); b.style.removeProperty("--bk");
  var cs=getComputedStyle(b), tk=parseFloat(cs.getPropertyValue("--tk"))||1.7, bk=parseFloat(cs.getPropertyValue("--bk"))||1.5, f=1;
  function over(){ if(b.scrollHeight>b.clientHeight+1) return true; var hs=b.querySelectorAll(".hc"); for(var i=0;i<hs.length;i++) if(hs[i].scrollHeight>hs[i].clientHeight+1) return true; return false; }
  for(var n=0;n<12&&over();n++){ f*=0.92; b.style.setProperty("--tk",(tk*f).toFixed(3)+"rem"); b.style.setProperty("--bk",(bk*f).toFixed(3)+"rem"); }
}
function renderWeek(){
  var board=document.getElementById("board"); board.innerHTML="";
  var days=pageDays(), cur=WEEK_OFF===0, ti=cur?todayIdx():(WEEK_OFF<0?7:-1), mon=viewMonday();
  board.className="n"+days.length+(cur?"":" otherweek");
  var fam=days.some(function(d){ return bookingsOn("all",vDateOfIdx(d)).length>0; });
  board.style.gridTemplateColumns="var(--kidw) repeat("+days.length+",minmax(0,1fr))";
  board.style.gridTemplateRows="auto"+(fam?" auto":"")+" repeat("+S.kids.length+",minmax(0,1fr))";
  board.appendChild(el("div","corner",S.layout==="all"?(cur?"This week":"Week"):(PAGE==="wd"?"Weekdays":"Weekend")));
  days.forEach(function(d){ var dd=new Date(mon); dd.setDate(mon.getDate()+d);
    board.appendChild(el("div","dh"+(d===ti?" today":""),(d===ti?"Today · ":"")+DAYS[d]+" "+dd.getDate())); });
  if(fam){
    board.appendChild(el("div","flbl","👪 Family"));
    days.forEach(function(d){ var c=el("div","fcell"+(d===ti?" todaycol":"")), h="";
      bookingsOn("all",vDateOfIdx(d)).forEach(function(b){ h+=bkChip(b); }); c.innerHTML=h; board.appendChild(c); });
  }
  S.kids.forEach(function(k){
    var lb=el("div","klbl"); lb.style.background="linear-gradient(160deg,"+k.colour+","+shade(k.colour,-0.2)+")"; lb.style.color=inkFor(k.colour);
    var im=el("img",""); im.src=avatarSrc(k); im.alt=k.name; lb.appendChild(im);
    lb.appendChild(el("div","kn",esc(k.name))); lb.appendChild(el("div","kc","🪙 "+(cur?weekPoints(k)+" this week":weekCoinsLogged(k,mon)+" that week")));
    board.appendChild(lb);
    days.forEach(function(d){
      var cell=el("div","dcell"+(d===ti?" todaycol":"")+(d<ti?" past":"")); cell.setAttribute("style",kidVars(k)); cell.setAttribute("data-kid",k.id); cell.setAttribute("data-day",d);
      ["am","pm"].forEach(function(slot){
        var half=el("div","half "+slot); half.appendChild(el("div","sl",slot==="am"?"☀️":"🌙"));
        var hc=el("div","hc"), jobs=splitJobs((k.tasks[d]||{})[slot]);
        var bks=bookingsOnSlot(k.id,vDateOfIdx(d),slot).filter(function(b){ return b.kid!=="all"; }), h="";
        bks.forEach(function(b){ h+=bkChip(b); }); hc.innerHTML=h;
        jobs.forEach(function(task,ji){
          var key=d+slot+(ji||""), done=cur?!!(S.done[k.id]&&S.done[k.id][key]):!!((logGet(vDateOfIdx(d),k.id,false)||{})[key.slice(1)]);
          var b=el("button","task nav"+(done?" done":"")+(d===ti?" todaycol":"")+(d<ti?" past":""));
          b.setAttribute("data-fid",k.id+"-"+key); b.setAttribute("data-kid",k.id); b.setAttribute("data-slot",slot); b.setAttribute("data-day",d); b.setAttribute("data-key",key);
          var tvv=done&&cur?kidCoinsDone(k,key):taskValue(task);
          b.innerHTML=(done?'<span class="ti">🪙</span>'+esc(task)+' ✓':'<span class="ti">'+iconFor(task)+'</span>'+esc(task))+'<span class="tval" aria-hidden="true">'+tvv+'</span>';
          b.setAttribute("aria-label",k.name+" "+DAYS_LONG[d]+" "+(slot==="am"?"morning":"afternoon")+": "+task+", "+tvv+" coins"+(done?" (done)":""));
          b.onclick=function(){
            if(!cur){ toast(WEEK_OFF<0?"That week is finished – only this week's jobs can be ticked":"Not yet! Jobs can be ticked in their own week"); return; }
            if(done){ confirmBox("Untick “"+esc(task)+"” for "+esc(k.name)+"?<br><span style='font-size:.7em;font-weight:normal'>This takes the coin back.</span>",[["Yes, untick","red",function(){ untick(k,key); }],["No","green",null]]); }
            else award(k,{type:"task",key:key});

          hc.appendChild(b);

function shade(hex,p){ var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255; function f(c){return Math.max(0,Math.min(255,Math.round(c+(p<0?c*p:(255-c)*p))));} return "rgb("+f(r)+","+f(g)+","+f(b)+")"; }

/* ---------- actions ---------- */
function award(k,act){
  var today=ymd(new Date());
  var v=act.type==="task"?taskValue(jobOfKey(k,act.key)):coinValue();
  if(act.type==="task"){ S.done[k.id]=S.done[k.id]||{}; S.done[k.id][act.key]=v; logTask(k.id,act.key,true); logCoins(k.id,dateOfIdx(+act.key[0]),v); ledgerAdd(k,"earn",v,"✅ "+taskText(k,act.key),{key:act.key}); }
  else { S.bonus[k.id]=(S.bonus[k.id]||0)+v; logBonus(k.id,today,1); logCoins(k.id,today,v); ledgerAdd(k,"bonus",v,"⭐ Bonus"); }
  k.lifetime+=v; S.history.push({kid:k.id,type:act.type,key:act.key||null,date:today,t:Date.now(),coins:v});
  if(S.history.length>50) S.history.shift();
  save();
  celebrate(k, function(){ render(); }, v);
}
function untick(k,key){
  var v=kidCoinsDone(k,key);
  if(S.done[k.id]) delete S.done[k.id][key];
  logTask(k.id,key,false); logCoins(k.id,dateOfIdx(+key[0]),-v); ledgerAdd(k,"unearn",-v,"↩ Unticked: "+taskText(k,key),{key:key});
  k.lifetime=Math.max(0,k.lifetime-v);
  for(var i=S.history.length-1;i>=0;i--){ var h=S.history[i]; if(h.kid===k.id&&h.type==="task"&&h.key===key){ S.history.splice(i,1); break; } }
  save(); render(); toast("Coin taken back from "+k.name);
}
function undo(){
  var h=S.history.pop(); if(!h) return;
  var k=kidById(h.kid); if(!k){ save(); render(); return; }
  var v=h.coins||coinValue();
  if(h.type==="task"){ if(S.done[k.id]) delete S.done[k.id][h.key]; logTask(k.id,h.key,false); logCoins(k.id,dateOfIdx(+h.key[0]),-v); ledgerAdd(k,"unearn",-v,"↩ Undo: "+taskText(k,h.key),{key:h.key}); }
  else { S.bonus[k.id]=Math.max(0,(S.bonus[k.id]||0)-v); logBonus(k.id,h.date||ymd(new Date()),-1); logCoins(k.id,h.date||ymd(new Date()),-v); ledgerAdd(k,"unbonus",-v,"↩ Undo: bonus"); }
  k.lifetime=Math.max(0,k.lifetime-v);
  save(); render();
  var what=h.type==="task"?((k.tasks[+h.key[0]]||{})[h.key.slice(1)]||"task")+" ("+DAYS[+h.key[0]]+")":"bonus coin";
  toast("Undone: "+what+" for "+k.name);
}

var AC=null;

function tone(freq,start,dur,type,vol,slideTo){
  var a=ac(); if(!a||!S.sound) return;
  var o=a.createOscillator(), g=a.createGain(), t=a.currentTime+start;
  o.type=type||"triangle"; o.frequency.setValueAtTime(freq,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
function sfxJump(){ tone(320,0,0.22,"square",0.08,880); }
function sfxBump(){ tone(140,0,0.12,"square",0.12,90); }

  [1046.5,1318.5,1568,2093].forEach(function(f,i){ tone(f,i*0.07,0.5-i*0.05,"triangle",0.22); tone(f*2,i*0.07,0.18,"sine",0.05); });
}
function sfxLand(){ tone(2637,0,0.25,"sine",0.12); tone(3136,0.06,0.3,"sine",0.1); tone(196,0,0.15,"triangle",0.15,150); }
function sfxFanfare(){ [523.25,659.25,783.99,1046.5,783.99,1046.5].forEach(function(f,i){ tone(f,0.05+i*0.11,i===5?0.6:0.16,"square",0.06); }); }

var anim=null;

    drawScene(t);

    var cx,cy,state="run";

      if(t<2.3){ ctx.fillStyle="#fff"; ctx.strokeStyle="#1d1b4b"; ctx.lineWidth=sc*8; ctx.font="bold "+Math.round(sc*70)+"px Trebuchet MS, sans-serif"; ctx.textAlign="center";

    }

    if(t>=3.1){ once("fan",sfxFanfare);
      for(var i=0;i<confetti.length;i++){ var c=confetti[i]; c.x+=c.vx; c.y+=c.vy; c.r+=0.1; ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.r); ctx.fillStyle=c.c; ctx.fillRect(-c.s/2,-c.s/4,c.s,c.s/2); ctx.restore(); }
    }
    // banner
    if(t>=3.0){ var bt=ease((t-3.0)/0.4); ctx.save(); ctx.translate(W/2,H*0.13); ctx.scale(bt,bt);

      var tw=Math.min(W*0.92,ctx.measureText(saying).width+sc*120);

      ctx.fillStyle="#fff"; ctx.fillText(saying,0,fs*0.05,tw-sc*60); ctx.restore();
      ctx.fillStyle="#1d1b4b"; ctx.font="bold "+Math.round(sc*40)+"px Trebuchet MS, sans-serif"; ctx.textAlign="center"; ctx.globalAlpha=bt; ctx.fillText("+1 Dojo coin",W/2,H*0.13+sc*110); ctx.globalAlpha=1; }

  }
  function cloud(x,y,s){ ctx.fillStyle="#fff"; [[0,0,60],[55,-25,70],[120,0,58],[60,15,60]].forEach(function(c){ ctx.beginPath(); ctx.arc(x+c[0]*s,y+c[1]*s,c[2]*s,0,Math.PI*2); ctx.fill(); }); }

function loadPhoto(file,cb){
  var fr=new FileReader();
  fr.onload=function(){ var im=new Image(); im.onload=function(){ var s=Math.min(im.width,im.height), c=document.createElement("canvas"); c.width=c.height=256;
      // centre-ish square crop, biased slightly up (faces sit high in portraits)
      var sx=(im.width-s)/2, sy=Math.max(0,(im.height-s)*0.35);
      c.getContext("2d").drawImage(im,sx,sy,s,s,0,0,256,256); cb(c.toDataURL("image/jpeg",0.85)); };
    im.onerror=function(){ toast("Couldn't read that image"); }; im.src=fr.result; };
  fr.readAsDataURL(file);
}

function taskKeyName(t){ return String(t||"").trim().toLowerCase().replace(/\s+/g," "); }
function taskValue(name){ var m=S.taskValues||{}, n=taskKeyName(name); if(m[n]!=null) return +m[n]; return coinValue(); }
function allTaskNames(){ var seen={}, out=[]; S.kids.forEach(function(k){ (k.tasks||[]).forEach(function(d){ ["am","pm"].forEach(function(s){ splitJobs((d||{})[s]).forEach(function(t){ if(!seen[taskKeyName(t)]){ seen[taskKeyName(t)]=1; out.push(t); } }); }); }); }); return out; }
function migrateTaskValues(){
  if((S.v||0)>=6) return;
  S.taskValues=S.taskValues||JSON.parse(JSON.stringify(TASK_VALUE_SEED));
  var has=S.kids.some(function(k){ return (k.tasks||[]).some(function(d){ return /feed chooks/i.test((d.am||"")+" "+(d.pm||"")); }); });
  if(!has){ var put=false;
    S.kids.forEach(function(k){ [5,6].forEach(function(i){ var d=k.tasks[i]; if(d&&d.am==="Pack lunch"){ d.am="Feed chooks"; put=true; } }); });
    if(!put){ outer: for(var i=0;i<7;i++) for(var j=0;j<S.kids.length;j++){ var d=S.kids[j].tasks[i]; if(d&&!d.am){ d.am="Feed chooks"; put=true; break outer; } } }
    if(!put&&S.kids[0]) S.kids[0].tasks[5].am="Feed chooks";
  }
}
function migrateDailyPm(){
  if((S.v||0)>=7) return;

}

function migrateEconomy(fresh){
  if((S.v||0)>=5) return;
  if(!fresh){ // v4 -> v4.2: 1 coin per job becomes 5 coins per job, once
    S.kids.forEach(function(k){ k.lifetime=(k.lifetime||0)*5; });
    for(var kid in S.done) for(var key in S.done[kid]) if(S.done[kid][key]) S.done[kid][key]=5*(S.done[kid][key]===true?1:+S.done[kid][key]||1);
    for(var kb in S.bonus) S.bonus[kb]=(S.bonus[kb]||0)*5;
    (S.history||[]).forEach(function(h){ h.coins=5; });
    for(var dt in S.log) for(var lk in S.log[dt]){ var e=S.log[dt][lk]; e.coins=((e.am?1:0)+(e.pm?1:0)+(e.bonus||0))*5; }
  }
  S.ledger=S.ledger||[];
  S.kids.forEach(function(k){ if(k.lifetime>0&&!S.ledger.some(function(e){return e.kid===k.id;})) ledgerAdd(k,"open",k.lifetime,"Coins brought forward (×5 coin update)"); });
  if(!S.items) S.items=defaultItems();
  S.pledges=S.pledges||{}; S.purchases=S.purchases||[];
  if(!S.coinValue) S.coinValue=5;
}
function kidCoinsDone(k,key){ var v=S.done[k.id]&&S.done[k.id][key]; return v===true?coinValue():(+v||0); }

/* marketplace actions (confirm first: OK confirms, Back cancels) */
function buyItem(it,k){
  var bal=balance(k);
  if(bal<it.price){ toast(k.name+" needs "+(it.price-bal)+" more coins for "+it.name); return; }
  confirmBox(it.emoji+" Buy <b>"+esc(it.name)+"</b> for "+esc(k.name)+"?<br><span style='font-size:.7em;font-weight:normal'>"+it.price+" coins · "+esc(k.name)+" has "+bal+"</span>",
    [["Cancel","grey",null],["✓ Buy","green",function(){
      var before=balance(k);
      var p={id:"p"+nowT().toString(36),t:nowT(),item:it.id,name:it.name,emoji:it.emoji,type:"individual",kids:{}}; p.kids[k.id]=it.price;
      S.purchases.push(p); ledgerAdd(k,"buy",-it.price,it.emoji+" Bought "+it.name,{ref:p.id}); save();
      sfxCoin(); render(); pileDrain(k,before,balance(k)); toast(k.name+" bought "+it.name+"!");
    }]]);
}
function pledge(it,k){
  var pl=S.pledges[it.id]=S.pledges[it.id]||{};
  if(pl[k.id]){ // withdraw (allowed until it unlocks)
    var c=pl[k.id]; delete pl[k.id]; ledgerAdd(k,"unpledge",c,"↩ Withdrew from "+it.emoji+" "+it.name,{item:it.id}); save(); render(); toast(k.name+" took back "+c+" coins"); return;
  }
  var bal=balance(k);
  if(bal<it.price){ toast(k.name+" needs "+(it.price-bal)+" more coins to join "+it.name); return; }
  confirmBox(it.emoji+" "+esc(k.name)+": put <b>"+it.price+" coins</b> towards "+esc(it.name)+"?<br><span style='font-size:.7em;font-weight:normal'>Unlocks when everyone has joined. You can take it back until then.</span>",
    [["Cancel","grey",null],["✓ Commit","green",function(){
      var before=balance(k);
      pl[k.id]=it.price; ledgerAdd(k,"pledge",-it.price,"🤝 Committed to "+it.emoji+" "+it.name,{item:it.id});
      var need=itemKids(it), all=need.every(function(kk){ return pl[kk.id]; });
      if(all){
        var p={id:"p"+nowT().toString(36),t:nowT(),item:it.id,name:it.name,emoji:it.emoji,type:"group",kids:{}};
        need.forEach(function(kk){ p.kids[kk.id]=pl[kk.id]; ledgerAdd(kk,"unlock",0,"🎉 "+it.emoji+" "+it.name+" unlocked!",{ref:p.id}); });
        S.purchases.push(p); delete S.pledges[it.id]; save(); render(); pileDrain(k,before,balance(k));
        celebrateUnlock(it,function(){ render(); var f=document.querySelector('#market [data-fid="mi-'+it.id+'-'+k.id+'"]')||preferredFocus(); focusEl(f); });
      } else { save(); sfxCoin(); render(); pileDrain(k,before,balance(k)); toast(k.name+" is in! "+need.filter(function(kk){return pl[kk.id];}).length+" of "+need.length); }
    }]]);
}
function undoPurchase(p){
  var names=Object.keys(p.kids).map(function(id){ var k=kidById(id); return k?k.name:"?"; }).join(", ");
  confirmBox("↶ Undo "+p.emoji+" <b>"+esc(p.name)+"</b>?<br><span style='font-size:.7em;font-weight:normal'>Gives the coins back to "+esc(names)+" (parent only).</span>",
    [["Cancel","grey",null],["↶ Undo purchase","orange",function(){
      p.undone=nowT();
      for(var id in p.kids){ var k=kidById(id); if(k) ledgerAdd(k,"refund",p.kids[id],"↶ Refund: "+p.emoji+" "+p.name+" (purchase undone)",{ref:p.id}); }
      save(); render(); toast("Purchase undone, coins returned");
    }]]);
}

  var n=from, step=Math.max(1,Math.ceil((from-to)/18)), t=setInterval(function(){ n=Math.max(to,n-step); paintPileCanvas(cv,n); if(n<=to) clearInterval(t); },45);

function celebrateUnlock(it,done){

  var ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); var T0=null, finished=false, D=4;
  var conf=[]; for(var i=0;i<140;i++) conf.push({x:Math.random()*W,y:-Math.random()*H,vy:2+Math.random()*4,vx:(Math.random()-.5)*3,r:Math.random()*6,c:COLOURS[i%COLOURS.length],s:8+Math.random()*10});

    var sc=Math.min(W/1920,H/1080), pop=Math.min(1,t*2.2), bounce=1+0.12*Math.sin(t*8)*Math.max(0,1-t/2);
    ctx.save(); ctx.translate(W/2,H*0.4); ctx.scale(pop*bounce,pop*bounce); ctx.font=Math.round(320*sc)+"px serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(it.emoji,0,0); ctx.restore();
    ctx.fillStyle="#1d1b4b"; ctx.font="bold "+Math.round(96*sc)+"px Trebuchet MS, sans-serif"; ctx.textAlign="center"; ctx.fillText(it.name+" unlocked!",W/2,H*0.68);
    var fw=150*sc; kids.forEach(function(im,i){ var x=W/2+(i-(kids.length-1)/2)*fw*1.3, y=H*0.83+Math.sin(t*6+i)*10*sc; ctx.save(); ctx.beginPath(); ctx.arc(x,y,fw/2,0,Math.PI*2); ctx.fillStyle="#fff"; ctx.fill(); ctx.clip(); if(im.complete&&im.naturalWidth) ctx.drawImage(im,x-fw/2,y-fw/2,fw,fw); ctx.restore(); });
    conf.forEach(function(c){ c.y+=c.vy; c.x+=c.vx; c.r+=0.1; if(c.y>H) c.y=-20; ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.r); ctx.fillStyle=c.c; ctx.fillRect(-c.s/2,-c.s/4,c.s,c.s/2); ctx.restore(); });
  }
  function stop(){ if(finished) return; finished=true; if(anim&&anim.raf) cancelAnimationFrame(anim.raf); layer.className="layer"; anim=null; if(done) done(); }

function histKey(dir){ // keys while the history list has focus

/* ---------- TV remote / keyboard spatial navigation (v4.1+) ----------
   Samsung Internet on Tizen moves a mouse pointer with the arrow keys unless the page itself handles them,
   so every arrow/OK/Back press is caught on window (capture phase), preventDefault()+stopPropagation(),
   and focus is moved geometrically to the nearest control in that direction. Something is always focused. */
function isShown(id){ var e=document.getElementById(id); return !!e&&e.className.indexOf("show")>=0; }
function activeRoot(){
  if(isShown("modal")) return document.getElementById("modal");
  if(isShown("codepad")) return document.getElementById("codepad");
  if(isShown("settings")) return document.getElementById("settings");
  return document.getElementById("app");
}
function visibleNavs(root){
  return [].filter.call(root.querySelectorAll(".nav"),function(e){ if(e.disabled) return false; if(e.offsetParent===null&&getComputedStyle(e).position!=="fixed") return false; var r=e.getBoundingClientRect(); return r.width>0&&r.height>0; });
}
function preferredFocus(root){
  root=root||activeRoot(); var list=visibleNavs(root); if(!list.length) return null;
  var p=null;
  if(root.id==="app"){
    if(S.view==="week") p=root.querySelector("#board .task.todaycol:not(.done)")||root.querySelector("#board .task.todaycol")||root.querySelector("#board .task:not(.done)");
    else if(S.view==="market") p=root.querySelector("#market .mitem .nav")||document.getElementById("viewMarket");
    else if(S.view==="history") p=document.getElementById("histList");
    else p=document.getElementById("viewRewards");
  } else if(root.id==="codepad") p=root.querySelector("#ckeys .ckey");
  else if(root.id==="modal") p=root.querySelector("#mbtns .nav");
  if(p&&list.indexOf(p)<0) p=null;
  return p||list[0];
}
function focusEl(e){ if(!e) return; try{ e.focus({preventScroll:true}); }catch(x){ e.focus(); }

}
var efT=null; function ensureFocusSoon(){ clearTimeout(efT); efT=setTimeout(ensureFocus,0); }

    var keys=[].slice.call(document.querySelectorAll("#ckeys .ckey")), n=keys.length, i=keys.indexOf(cur), t0=keys[0].offsetTop, cols=0;
    keys.forEach(function(kk){ if(Math.abs(kk.offsetTop-t0)<4) cols++; });

    else if(dir==="up"){ if(q.bottom>r.top+2&&dy>=-2) return; main=Math.max(0,r.top-q.bottom); cross=Math.abs(dx); overlap=Math.min(r.right,q.right)-Math.max(r.left,q.left); }

function applyPayload(p,code){
  var photos=[], n=0;

}
