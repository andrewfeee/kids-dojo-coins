<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#4cc9f0">
<title>Dojo Coins</title>
<style>
*{box-sizing:border-box}
html{font-size:calc(100vw / 120)}
@media (max-aspect-ratio:4/3){html{font-size:calc(100vw / 60)}}
@media (max-width:700px){html{font-size:15px}}
body{margin:0;min-height:100vh;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;color:#1d1b4b;
 background:linear-gradient(180deg,#4cc9f0 0%,#8ee3f7 60%,#b8f2a6 100%);overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.cloud{position:fixed;background:#fff;border-radius:50px;opacity:.75;z-index:0}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:14rem;height:4rem;top:3rem;left:8%}.c1:before{width:6rem;height:6rem;top:-3rem;left:2rem}.c1:after{width:5rem;height:5rem;top:-2rem;left:7rem}
.c2{width:12rem;height:3.5rem;top:6rem;right:12%}.c2:before{width:5rem;height:5rem;top:-2.5rem;left:2rem}.c2:after{width:4rem;height:4rem;top:-1.6rem;left:6rem}
#app{position:relative;z-index:1;padding:1.2rem 1.6rem 1rem;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;margin-bottom:1rem}
header h1{margin:0;font-size:3rem;letter-spacing:.05rem;color:#fff;text-shadow:0 .25rem 0 #f15bb5,0 .5rem .6rem rgba(0,0,0,.25);flex:1;white-space:nowrap}
header h1 .coin-i{display:inline-block;width:2.6rem;height:2.6rem;border-radius:50%;vertical-align:-.35rem;margin-right:.6rem;
 background:radial-gradient(circle at 35% 30%,#fff7b0 0 12%,#ffd23f 30%,#f4a100 75%,#c77a00 100%);box-shadow:0 .2rem 0 #a86400}
.weeklbl{font-size:1.6rem;font-weight:bold;color:#1d1b4b;background:rgba(255,255,255,.75);padding:.5rem 1.2rem;border-radius:2rem;margin-right:1rem;white-space:nowrap}
.btn{font-size:1.6rem;font-weight:bold;border:none;border-radius:1.2rem;padding:.8rem 1.4rem;margin-left:.7rem;color:#fff;
 background:#7b2cbf;box-shadow:0 .35rem 0 #4a1677;transition:transform .12s,box-shadow .12s;outline:none;white-space:nowrap}
.btn.orange{background:#ff8c1a;box-shadow:0 .35rem 0 #b35a00}
.btn.green{background:#2bb673;box-shadow:0 .35rem 0 #17794a}
.btn.red{background:#e63946;box-shadow:0 .35rem 0 #99202a}
.btn.grey{background:#6c757d;box-shadow:0 .35rem 0 #42484d}
.btn:disabled{opacity:.45}
:focus{outline:none}
.nav:focus,.nav.kbd-focus{transform:scale(1.07);box-shadow:0 0 0 .4rem #fff,0 0 0 .8rem #ffbe0b,0 .6rem 1.2rem rgba(0,0,0,.35)!important;z-index:5;position:relative}
#board{flex:1;display:flex;flex-direction:column}
.kidrow{flex:1;display:grid;grid-template-columns:23rem 1fr;grid-gap:1rem;background:rgba(255,255,255,.55);border-radius:2rem;padding:1rem;margin-bottom:1rem;
 border:.35rem solid #fff;box-shadow:0 .5rem 1.2rem rgba(0,0,0,.12)}
.kidpanel{border-radius:1.5rem;padding:.8rem;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:#fff;position:relative}
.kidtop{display:flex;align-items:center;width:100%}
.avatar{width:6.5rem;height:6.5rem;border-radius:50%;border:.35rem solid #fff;object-fit:cover;background:#fff;box-shadow:0 .25rem .5rem rgba(0,0,0,.3);flex:none}
.kidname{font-size:2.3rem;font-weight:bold;margin-left:.8rem;text-shadow:0 .15rem 0 rgba(0,0,0,.25);line-height:1.05;overflow:hidden;text-overflow:ellipsis}
.pts{font-size:1.2rem;margin-left:.8rem;opacity:.95}
.pts b{font-size:3rem;display:block;line-height:1;text-shadow:0 .2rem 0 rgba(0,0,0,.25)}
.pilecv{width:100%;flex:1;min-height:8rem;display:block}
.lifetime{font-size:1.25rem;font-weight:bold;background:rgba(0,0,0,.18);border-radius:1rem;padding:.25rem .8rem}
.bonus{font-size:1.3rem;padding:.5rem 1rem;margin:0;background:#ffbe0b;color:#3d2a00;box-shadow:0 .3rem 0 #b88600}
.kidbottom{display:flex;align-items:center;justify-content:space-between;width:100%}
.weekwrap{height:100%}
.week{height:100%;display:grid;grid-template-columns:7.5rem repeat(7,1fr);grid-template-rows:2.6rem 1fr 1fr;grid-gap:.6rem}
.dayhd{text-align:center;font-weight:bold;font-size:1.45rem;border-radius:1rem;padding:.35rem 0;background:rgba(255,255,255,.8)}
.dayhd.today{background:#ffbe0b;color:#3d2a00}
.slothd{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;font-size:1.3rem;border-radius:1rem;background:rgba(255,255,255,.8)}
.slothd span{font-size:2.2rem}
.cell{border:none;border-radius:1.2rem;background:#fff;color:#1d1b4b;font-size:1.35rem;font-weight:bold;padding:.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;
 box-shadow:0 .3rem 0 #c9c3e6;transition:transform .12s;min-height:5.5rem;line-height:1.15;text-align:center;word-break:break-word}
.cell .ic{font-size:2.4rem;line-height:1.1}
.cell.todaycol{background:#fff8dc;box-shadow:0 .3rem 0 #e8c44f}
.cell.past:not(.done){opacity:.75}
.cell.done{background:radial-gradient(circle at 50% 35%,#fff3a0,#ffd23f 55%,#f4a100);color:#5a3500;box-shadow:0 .3rem 0 #b06f00}
.cell.done .ic{font-size:2.6rem}
.cell.empty{background:rgba(255,255,255,.4);box-shadow:none;color:#888}
#board.many .kidrow{padding:.5rem 1rem;margin-bottom:.6rem;min-height:0;border-radius:1.6rem;grid-template-columns:21rem 1fr}
#board.many .kidpanel{padding:.5rem .7rem}
#board.many .avatar{width:4.6rem;height:4.6rem;border-width:.28rem}
#board.many .kidname{font-size:1.9rem}
#board.many .pts b{font-size:2.3rem}
#board.many .pts{font-size:1.05rem}
#board.many .pilecv{min-height:3rem}
#board.many .week{grid-template-rows:2.1rem 1fr 1fr;grid-gap:.45rem}
#board.many .dayhd{font-size:1.25rem;padding:.2rem 0}
#board.many .cell{min-height:4.2rem;font-size:1.25rem;padding:.2rem}
#board.many .cell .ic{font-size:1.9rem}
#board.many .slothd span{font-size:1.7rem}
#board.many .lifetime{font-size:1.1rem}
#board.many .bonus{font-size:1.15rem;padding:.35rem .8rem}
.bkg{font-size:1.05rem;font-weight:bold;background:#4361ee;color:#fff;border-radius:.55rem;padding:.15rem .4rem;margin:0 0 .2rem;line-height:1.15;width:100%;box-shadow:0 .12rem 0 #2a3ea8;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;word-break:break-word;overflow-wrap:break-word;text-align:center}
.cell.done .bkg{background:#4361ee;color:#fff;box-shadow:0 .12rem 0 #2a3ea8}
.cell.hasbkg{justify-content:flex-start;padding-top:.3rem}
#board.many .bkg{font-size:1.05rem;padding:.12rem .3rem;margin-bottom:.15rem}
.mbk{font-size:1.15rem;font-weight:bold;color:#4361ee;margin-top:.15rem}
.dbk{font-size:1.4rem;font-weight:bold;border-radius:1rem;padding:.7rem 1rem;margin:.3rem .6rem .3rem 0;background:#4361ee;color:#fff;display:inline-block;box-shadow:0 .25rem 0 #2a3ea8}
.bkline{display:flex;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.12);border-radius:1rem;padding:.6rem .8rem;margin:.4rem 0;font-size:1.5rem;font-weight:bold}
.bkline .sp{flex:1}
.bkopt{background:rgba(255,255,255,.25);box-shadow:0 .35rem 0 rgba(0,0,0,.25);margin-left:0;margin-right:.6rem}
.bkopt.sel{background:#ffbe0b;color:#3d2a00;box-shadow:0 .35rem 0 #b88600}
.timeadj{font-size:2.2rem;min-width:12rem;text-align:center;font-weight:bold;letter-spacing:.05rem}
header{margin-bottom:.7rem}
footer{font-size:1.1rem;color:#1d1b4b;opacity:.75;text-align:center}
/* overlays */
.layer{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;display:none}
.layer.show{display:block}
#celebrate canvas{width:100%;height:100%;display:block}
#settings{background:linear-gradient(180deg,#7b2cbf,#4361ee);overflow:auto;color:#fff}
.sbox{max-width:110rem;margin:0 auto;padding:1.5rem 2rem 3rem}
.sbox h2{font-size:2.8rem;margin:.2rem 0 1rem;display:flex;align-items:center}
.sbox h2 .sp{flex:1}
.sbox h3{font-size:1.9rem;margin:1.4rem 0 .6rem}
.card{background:rgba(255,255,255,.14);border-radius:1.5rem;padding:1.2rem;margin-bottom:1rem}
.row{display:flex;align-items:center;flex-wrap:wrap}
.row > *{margin:.3rem .8rem .3rem 0}
.kidtab{background:rgba(255,255,255,.25);box-shadow:0 .35rem 0 rgba(0,0,0,.25);margin-left:0;margin-right:.8rem}
.kidtab.sel{background:#ffbe0b;color:#3d2a00;box-shadow:0 .35rem 0 #b88600}
label.lbl{font-size:1.5rem;font-weight:bold;min-width:8rem}
input.txt{font-size:1.6rem;padding:.6rem .9rem;border-radius:1rem;border:.25rem solid #fff;font-family:inherit;color:#1d1b4b;width:100%;background:#fff}
input.txt:focus{border-color:#ffbe0b;box-shadow:0 0 0 .35rem #ffbe0b}
.sw{width:3.4rem;height:3.4rem;border-radius:50%;border:.3rem solid #fff;margin:0 .5rem 0 0;box-shadow:none}
.sw.sel{border-color:#1d1b4b;outline:.3rem solid #fff}
.tgrid{display:grid;grid-template-columns:7rem 1fr 1fr;grid-gap:.6rem;align-items:center}
.tgrid .h{font-weight:bold;font-size:1.5rem}
.small{font-size:1.2rem;opacity:.9}
.sav{width:7rem;height:7rem;border-radius:50%;border:.35rem solid #fff;object-fit:cover;background:#fff}
#modal{background:rgba(20,10,60,.65)}
#modal .mbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:2rem;padding:2rem 2.5rem;min-width:40rem;max-width:90vw;text-align:center;box-shadow:0 1rem 3rem rgba(0,0,0,.4)}
#modal p{font-size:2rem;font-weight:bold;margin:0 0 1.5rem}
.vt{background:rgba(255,255,255,.35);box-shadow:0 .35rem 0 rgba(0,0,0,.2);color:#1d1b4b}
.vt.sel{background:#fff;color:#7b2cbf;box-shadow:0 .35rem 0 #c9c3e6}
#month{flex:1;display:flex;flex-direction:column;background:rgba(255,255,255,.55);border-radius:2rem;border:.35rem solid #fff;padding:1rem;margin-bottom:1rem;box-shadow:0 .5rem 1.2rem rgba(0,0,0,.12)}
.mhead{display:flex;align-items:center;justify-content:center;margin-bottom:.8rem}
.mhead .btn{margin:0 .6rem}
.mtitle{font-size:2.6rem;font-weight:bold;min-width:24rem;text-align:center;color:#1d1b4b}
.mlegend{display:flex;justify-content:center;flex-wrap:wrap;font-size:1.3rem;font-weight:bold;margin-bottom:.6rem}
.mlegend span{margin:0 1rem;display:flex;align-items:center}
.mlegend i{display:inline-block;width:1.3rem;height:1.3rem;border-radius:50%;margin-right:.4rem}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto;grid-auto-rows:1fr;grid-gap:.5rem}
.mdh{text-align:center;font-weight:bold;font-size:1.5rem;background:rgba(255,255,255,.8);border-radius:1rem;padding:.3rem 0}
.mday{border:none;border-radius:1.1rem;background:#fff;color:#1d1b4b;padding:.35rem .5rem;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;box-shadow:0 .25rem 0 #c9c3e6;min-height:6.2rem;text-align:left;font-family:inherit;transition:transform .12s}
.mday.other{opacity:.45}
.mday.today{background:#fff3b8;box-shadow:0 0 0 .3rem #ffbe0b,0 .25rem 0 #e8c44f}
.mday.future .mk{opacity:.55}
.mnum{font-size:1.6rem;font-weight:bold;line-height:1.1}
.mday.today .mnum:after{content:" Today";font-size:1rem;color:#b06f00}
.mk{display:flex;align-items:center;font-size:1.4rem;font-weight:bold;margin-top:.15rem;white-space:nowrap}
.mk i{display:inline-block;width:1.3rem;height:1.3rem;border-radius:50%;margin-right:.35rem;flex:none}
.tk{display:inline-block;width:1.9rem;height:1.9rem;border-radius:.45rem;margin-right:.25rem;text-align:center;line-height:1.9rem;font-size:1.25rem;background:#eee;color:#bbb}
.tk.y{background:#2bb673;color:#fff}
.mc{margin-left:.3rem;color:#b06f00}
.daylist{text-align:left;max-height:70vh;overflow:auto}
.daykid{display:flex;align-items:center;margin:.6rem 0;flex-wrap:wrap}
.daykid img{width:4.5rem;height:4.5rem;border-radius:50%;border:.3rem solid;object-fit:cover;margin-right:.8rem}
.daykid .nm{font-size:1.8rem;font-weight:bold;min-width:9rem}
.dtask{font-size:1.4rem;font-weight:bold;border:none;border-radius:1rem;padding:.7rem 1rem;margin:.3rem .6rem .3rem 0;background:#f1efff;color:#1d1b4b;box-shadow:0 .25rem 0 #c9c3e6;font-family:inherit}
.dtask.done{background:radial-gradient(circle at 50% 35%,#fff3a0,#ffd23f 55%,#f4a100);color:#5a3500;box-shadow:0 .25rem 0 #b06f00}
.dnote{font-size:1.2rem;color:#555;margin:.4rem 0 1rem}
#modal .mbox.wide{min-width:60rem}
#toast{position:fixed;left:50%;bottom:2rem;transform:translateX(-50%);background:#1d1b4b;color:#fff;font-size:1.6rem;padding:.8rem 1.6rem;border-radius:2rem;z-index:80;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
/* phone / portrait */
@media (max-width:900px){
 #app{padding:.6rem}
 header{flex-wrap:wrap}
 header h1{font-size:2rem;flex:1 1 100%;margin-bottom:.5rem}
 .weeklbl{font-size:1rem;margin-right:auto;flex:1 1 100%;margin-bottom:.4rem;text-align:center}
 .btn{font-size:1.05rem;padding:.6rem .8rem;margin-left:.4rem}
 .kidrow{grid-template-columns:1fr;padding:.6rem}
 .kidpanel{flex-direction:row;flex-wrap:wrap}
 .kidtop{width:auto;flex:1}
 .avatar{width:4.5rem;height:4.5rem}
 .kidname{font-size:1.6rem}.pts b{font-size:2rem}
 .pilecv{height:6rem;width:100%;order:3}
 .kidbottom{order:4}
 .weekwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
 .week{min-width:62rem;height:auto;grid-template-columns:5rem repeat(7,1fr)}
 .pilecv{flex:none}
 .cell{font-size:.95rem;min-height:5.5rem;word-break:normal;overflow-wrap:break-word}.cell .ic{font-size:1.8rem}
 .dayhd{font-size:1.05rem}.slothd{font-size:1rem}
 .tgrid{grid-template-columns:4.5rem 1fr 1fr}
 #modal .mbox{min-width:0;width:90vw}
 #modal .mbox.wide{min-width:0}
 .mgrid{grid-gap:.25rem}.mday{min-height:4.5rem;padding:.2rem}.mnum{font-size:1rem}.mk{font-size:.75rem}.mk i{width:.6rem;height:.6rem;margin-right:.15rem}
 .tk{width:.95rem;height:.95rem;line-height:.95rem;font-size:.65rem;margin-right:.1rem;border-radius:.25rem}.mday.today .mnum:after{content:""}
 .mtitle{font-size:1.5rem;min-width:9rem}.mdh{font-size:.9rem}.mlegend{font-size:.9rem}
 .bkg{font-size:.8rem}.mbk{font-size:.8rem}.dbk{font-size:1.05rem;padding:.5rem .7rem}
 .timeadj{font-size:1.4rem;min-width:7rem}
}
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div id="app">
 <header>
  <h1><span class="coin-i"></span>Dojo Coins</h1>
  <div class="weeklbl" id="weeklbl"></div>
  <button class="btn vt nav" id="viewWeek">📅 Week</button>
  <button class="btn vt nav" id="viewMonth">🗓️ Month</button>
  <button class="btn orange nav" id="undoBtn">&#8630; Undo</button>
  <button class="btn nav" id="settingsBtn">&#9881; Settings</button>
 </header>
 <div id="board"></div>
 <div id="month" style="display:none"></div>
 <footer>Arrows to move &middot; OK/Enter to tick a job &middot; finish a job to earn a coin!</footer>
</div>

<div class="layer" id="celebrate"><canvas id="ccv"></canvas></div>
<div class="layer" id="settings"><div class="sbox" id="sbox"></div></div>
<div class="layer" id="modal"><div class="mbox"><p id="mtext"></p><div id="mbtns"></div></div></div>
<div id="toast"></div>

var KEY = "kidsDojo.v1";
var DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var DAYS_LONG = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var AM_DEFAULT = ["Stack dishwasher","Sort laundry","Pack lunch"];
var PM_DEFAULT = ["Unpack bag","Homework / reading","Tidy room"];
var COLOURS = ["#3a86ff","#f15bb5","#2bb673","#ff8c1a","#7b2cbf","#e63946"];
var MAX_KIDS = 4;

/* ---------- dates ---------- */
function mondayOf(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function ymd(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function todayIdx(){ return (new Date().getDay()+6)%7; }
function weekKey(){ return ymd(mondayOf(new Date())); }

/* ---------- state ---------- */
function defaultTasks(offset){
  var t=[]; for(var i=0;i<7;i++){ t.push({am:AM_DEFAULT[(i+offset)%3], pm:PM_DEFAULT[(i+offset)%3]}); } return t;
}
function newKid(i,name){
  return {id:"k"+Date.now().toString(36)+i, name:name, photo:null, avatarIdx:i%DEFAULT_AVATARS.length, colour:COLOURS[i%COLOURS.length], lifetime:0, tasks:defaultTasks(i)};
}
function defaultBookings(){ return []; }
function freshState(){
  var kids=[newKid(0,"Charlie"),newKid(1,"Pip"),newKid(2,"Jack")];
  return {v:3, kids:kids, week:weekKey(), done:{}, bonus:{}, history:[], log:{}, view:"week", sound:true, autoReset:true, bookings:[]};
}
var S;
function load(){
  try{ S=JSON.parse(localStorage.getItem(KEY)); }catch(e){ S=null; }
  if(!S||!S.kids||!S.kids.length){ S=freshState(); }
  S.done=S.done||{}; S.bonus=S.bonus||{}; S.history=S.history||[]; S.view="week"; // Week is always the main view on load
  // upgrade old 2-kid default (Charlie + "Kid 2") to Charlie, Pip, Jack
  if(S.kids.length===2&&S.kids[1].name==="Kid 2"&&!S.kids[1].photo){ S.kids[1].name="Pip"; S.kids.push(newKid(2,"Jack")); save(); }
  if(!S.log){ S.log={}; migrateLog(); }
  if(!S.bookings){ S.bookings=[]; }
  S.bookings=S.bookings.filter(function(b){ return b && b.id!=="bseedtennis"; });
  S.v=3; save();
  checkWeek();
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast("Couldn't save – storage full? Try a smaller photo."); }
}
function checkWeek(){
  var wk=weekKey();
  if(S.week!==wk){
    if(S.autoReset){ S.done={}; S.bonus={}; S.history=[]; }
    S.week=wk; save();
  }
}
/* log: { "YYYY-MM-DD": { kidId: {am:bool, pm:bool, bonus:n} } } — keeps history for the month view */
function dateOfIdx(d){ var x=mondayOf(new Date()); x.setDate(x.getDate()+d); return ymd(x); }
function logGet(date,kid,create){ var L=S.log[date]; if(!L){ if(!create) return null; L=S.log[date]={}; } var e=L[kid]; if(!e&&create) e=L[kid]={am:false,pm:false,bonus:0}; return e; }
function logTask(kid,key,val){ var e=logGet(dateOfIdx(+key[0]),kid,true); e[key.slice(1)]=val; }
function logBonus(kid,date,delta){ var e=logGet(date,kid,true); e.bonus=Math.max(0,(e.bonus||0)+delta); }
function migrateLog(){ for(var kid in S.done){ for(var key in S.done[kid]) if(S.done[kid][key]) logTask(kid,key,true); } for(var kid2 in S.bonus){ if(S.bonus[kid2]) logBonus(kid2,ymd(new Date()),S.bonus[kid2]); } }
function kidById(id){ for(var i=0;i<S.kids.length;i++) if(S.kids[i].id===id) return S.kids[i]; return null; }
function weekPoints(k){
  var d=S.done[k.id]||{}, n=0; for(var key in d) if(d[key]) n++;
  return n+(S.bonus[k.id]||0);
}
function avatarSrc(k){ return k.photo || DEFAULT_AVATARS[k.avatarIdx||0] || DEFAULT_AVATARS[0]; }

/* ---------- helpers ---------- */
function el(tag,cls,html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function iconFor(t){
  t=(t||"").toLowerCase();
  var map=[["dish","🍽️"],["laundry","🧺"],["wash","🧼"],["lunch","🥪"],["bag","🎒"],["home","📚"],["read","📚"],["tidy","🧸"],["room","🧸"],["bed","🛏️"],["teeth","🪥"],["dog","🐶"],["cat","🐱"],["feed","🥣"],["bin","🗑️"],["rubbish","🗑️"],["shower","🚿"],["bath","🛁"],["practice","🎵"],["piano","🎹"],["table","🍴"],["shoe","👟"],["uniform","👕"],["dress","👕"],["water","💧"],["plant","🌱"]];
  for(var i=0;i<map.length;i++) if(t.indexOf(map[i][0])>=0) return map[i][1];

function bookingIcon(t){
  t=(t||"").toLowerCase();
  var map=[["tennis","🎾"],["swim","🏊"],["pool","🏊"],["nippers","🏖️"],["surf","🏄"],["sail","⛵"],["footy","🏉"],["afl","🏉"],["soccer","⚽"],["football","⚽"],["rugby","🏉"],["cricket","🏏"],["netball","🏐"],["basketball","🏀"],["ballet","🩰"],["dance","💃"],["gymnast","🤸"],["karate","🥋"],["judo","🥋"],["taekwondo","🥋"],["piano","🎹"],["violin","🎻"],["strings","🎻"],["guitar","🎸"],["choir","🎤"],["music","🎵"],["drama","🎭"],["art","🎨"],["athletics","🏃"],["running","🏃"],["horse","🐴"],["riding","🐴"],["homework","📚"],["study","📚"],["doctor","🩺"],["dentist","🦷"],["hospital","🏥"],["haircut","✂️"],["party","🎉"],["birthday","🎂"],["church","⛪"],["scouts","🏕️"],["guides","🏕️"],["lesson","📘"],["tutor","📘"],["tuition","📘"],["training","🏅"],["practice","🏅"],["playdate","🧸"],["sleepover","🌙"],["appointment","📅"]];
  for(var i=0;i<map.length;i++) if(t.indexOf(map[i][0])>=0) return map[i][1];
  return "📅";
}
function parseTime(s){
  var m=/^(\d{1,2}):(\d{2})$/.exec(String(s||"").trim());
  var h=m?+m[1]:8, min=m?+m[2]:30;
  if(h<0) h=0; if(h>23) h=23; if(min<0) min=0; if(min>59) min=59;
  return {h:h,min:min};
}
function padTime(s){ var t=parseTime(s); return ("0"+t.h).slice(-2)+":"+("0"+t.min).slice(-2); }
function fmtClock(s, withPeriod){
  var t=parseTime(s), h=t.h%12; if(!h) h=12;
  var out=String(h);
  if(t.min) out+=":"+("0"+t.min).slice(-2);
  if(withPeriod) out+=(t.h<12?"am":"pm");
  return out;
}
function fmtTime(s){ return fmtClock(s, true); }
function fmtTimeRange(start, end){
  if(!end) return fmtTime(start);
  var a=parseTime(start), b=parseTime(end);
  if((a.h<12)===(b.h<12)) return fmtClock(start, false)+"–"+fmtTime(end);
  return fmtTime(start)+"–"+fmtTime(end);
}
function timeMinutes(s){ var t=parseTime(s); return t.h*60+t.min; }
function isAmTime(s){ return timeMinutes(s)<12*60; }
function bookingLabel(b){ return bookingIcon(b.title)+" "+(b.title||"Booking")+" "+fmtTimeRange(b.time, b.end); }
function dateFromYmd(s){ var p=String(s||"").split("-"); return new Date(+p[0]||2000,(+p[1]||1)-1,+p[2]||1); }
function weekdayOfYmd(s){ return (dateFromYmd(s).getDay()+6)%7; }
function bookingsOn(kidId, dateStr){
  var wd=weekdayOfYmd(dateStr), out=[];
  (S.bookings||[]).forEach(function(b){
    if(!(b.kid==="all"||b.kid===kidId)) return;
    if(b.recur==="weekly"){ if(+b.weekday===wd) out.push(b); }
    else if(b.date===dateStr) out.push(b);
  });
  out.sort(function(a,c){ return timeMinutes(a.time)-timeMinutes(c.time)||String(a.title||"").localeCompare(c.title||""); });
  return out;
}
function bookingsOnSlot(kidId, dateStr, slot){
  return bookingsOn(kidId, dateStr).filter(function(b){ return isAmTime(b.time)?slot==="am":slot==="pm"; });
}
function bookingsOnDate(dateStr){
  var seen={}, out=[];
  (S.kids||[]).forEach(function(k){
    bookingsOn(k.id, dateStr).forEach(function(b){ if(!seen[b.id]){ seen[b.id]=1; out.push(b); } });
  });
  out.sort(function(a,c){ return timeMinutes(a.time)-timeMinutes(c.time); });
  return out;
}
function bookingWhoName(b){
  if(b.kid==="all") return "Whole family";
  var k=kidById(b.kid); return k?k.name:"(removed)";
}
function bookingWhenText(b){
  if(b.recur==="weekly") return "every "+DAYS_LONG[+b.weekday||0];
  var d=dateFromYmd(b.date||ymd(new Date()));
  return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();
}

/* ---------- coin pile ---------- */
var PILE_CAP=150, STACKS=9;
function pileLayout(n){
  var h=[],pos=[],c=(STACKS-1)/2,i,k; for(i=0;i<STACKS;i++) h.push(0);
  var m=Math.min(n,PILE_CAP);
  for(k=0;k<m;k++){
    var best=-1,bs=1e9;
    for(i=0;i<STACKS;i++){ var s=h[i]+1.7*Math.abs(i-c)+(i<c?0.01:0); if(s<bs){bs=s;best=i;} }
    pos.push({s:best-c,l:h[best],j:((k*37)%7-3)/3}); h[best]++;
  }
  return pos;
}
function drawCoinFlat(ctx,x,y,w){
  var hh=w*0.36, th=w*0.16;
  ctx.fillStyle="#b86e00"; ctx.beginPath(); ctx.ellipse(x,y+th,w/2,hh/2,0,0,Math.PI*2); ctx.fill();
  ctx.fillRect(x-w/2,y,w,th);
  ctx.fillStyle="#e39b00"; ctx.fillRect(x-w/2,y,w,th*0.55);
  var g=ctx.createLinearGradient(x-w/2,y-hh/2,x+w/2,y+hh/2); g.addColorStop(0,"#fff3a0"); g.addColorStop(.45,"#ffd23f"); g.addColorStop(1,"#f2a300");
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y,w/2,hh/2,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="rgba(150,90,0,.55)"; ctx.lineWidth=Math.max(1,w*0.04); ctx.beginPath(); ctx.ellipse(x,y,w*0.34,hh*0.32,0,0,Math.PI*2); ctx.stroke();
}
function pileGeom(cw,ch,n){
  var pos=pileLayout(Math.max(1,n||1)), span=0, ml=1;
  pos.forEach(function(p){ span=Math.max(span,Math.abs(p.s)); ml=Math.max(ml,p.l+1); });
  span=Math.max(span,1.5); ml=Math.max(ml,3);
  var w=Math.min(cw/(2*span*0.8+1.4), ch/(ml*0.16+0.8), cw/4.2); return {w:w, th:w*0.16, cx:cw/2, base:ch-w*0.36};
}
function coinPos(p,g){ return {x:g.cx+p.s*g.w*0.8+p.j*g.w*0.06, y:g.base-p.l*g.th - g.w*0.1}; }
function drawPile(ctx,n,cw,ch,opt){
  opt=opt||{};
  var g=pileGeom(cw,ch,opt.geomN||n), pos=pileLayout(n);
  // shadow
  ctx.fillStyle="rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(g.cx,g.base+g.w*0.15,Math.min(cw*0.48,g.w*4.3),g.w*0.35,0,0,Math.PI*2); ctx.fill();
  var order=pos.map(function(p,i){return i;}).sort(function(a,b){ return pos[a].l-pos[b].l || Math.abs(pos[b].s)-Math.abs(pos[a].s); });
  for(var i=0;i<order.length;i++){ var c=coinPos(pos[order[i]],g); drawCoinFlat(ctx,c.x,c.y,g.w); }
  if(n===0 && !opt.noEmpty){ ctx.fillStyle="rgba(255,255,255,.85)"; ctx.font="bold "+Math.round(Math.min(ch*0.15,cw/13))+"px Trebuchet MS, sans-serif"; ctx.textAlign="center"; ctx.fillText("No coins yet – let's go!",cw/2,ch*0.55,cw*0.95); }
  if(n>PILE_CAP){ ctx.fillStyle="#fff"; ctx.font="bold "+Math.round(ch*0.16)+"px Trebuchet MS, sans-serif"; ctx.textAlign="right"; ctx.fillText("+"+(n-PILE_CAP)+" more!",cw-4,ch*0.2); }
  return g;
}
function nextCoinTarget(n,cw,ch){ // position the n-th coin (1-based) lands at
  var g=pileGeom(cw,ch,n), pos=pileLayout(n); var p=pos[Math.min(n,PILE_CAP)-1]; if(!p) return {x:g.cx,y:g.base,w:g.w};
  var c=coinPos(p,g); c.w=g.w; return c;
}
function paintPileCanvas(cv,n){
  var r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  if(!r.width) return;
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  var ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
  drawPile(ctx,n,r.width,r.height);
}

      for(var d=0;d<7;d++){
        (function(d){
          var task=(k.tasks[d]||{})[slot]||"", key=d+slot, done=!!(S.done[k.id]&&S.done[k.id][key]);

function shade(hex,p){ var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255; function f(c){return Math.max(0,Math.min(255,Math.round(c+(p<0?c*p:(255-c)*p))));} return "rgb("+f(r)+","+f(g)+","+f(b)+")"; }

/* ---------- actions ---------- */
function award(k,act){
  var today=ymd(new Date());
  if(act.type==="task"){ S.done[k.id]=S.done[k.id]||{}; S.done[k.id][act.key]=true; logTask(k.id,act.key,true); }
  else { S.bonus[k.id]=(S.bonus[k.id]||0)+1; logBonus(k.id,today,1); }
  k.lifetime++; S.history.push({kid:k.id,type:act.type,key:act.key||null,date:today,t:Date.now()});
  if(S.history.length>50) S.history.shift();
  save();
  celebrate(k, function(){ render(); });
}
function untick(k,key){
  if(S.done[k.id]) delete S.done[k.id][key];
  logTask(k.id,key,false);
  k.lifetime=Math.max(0,k.lifetime-1);
  for(var i=S.history.length-1;i>=0;i--){ var h=S.history[i]; if(h.kid===k.id&&h.type==="task"&&h.key===key){ S.history.splice(i,1); break; } }
  save(); render(); toast("Coin taken back from "+k.name);
}
function undo(){
  var h=S.history.pop(); if(!h) return;
  var k=kidById(h.kid); if(!k){ save(); render(); return; }
  if(h.type==="task"){ if(S.done[k.id]) delete S.done[k.id][h.key]; logTask(k.id,h.key,false); }
  else { S.bonus[k.id]=Math.max(0,(S.bonus[k.id]||0)-1); logBonus(k.id,h.date||ymd(new Date()),-1); }
  k.lifetime=Math.max(0,k.lifetime-1);
  save(); render();
  var what=h.type==="task"?((k.tasks[+h.key[0]]||{})[h.key.slice(1)]||"task")+" ("+DAYS[+h.key[0]]+")":"bonus coin";
  toast("Undone: "+what+" for "+k.name);
}
document.getElementById("undoBtn").onclick=undo;

  mt.appendChild(el("div","",DAYS_LONG[wd]+" "+day.getDate()+" "+MONTHS_LONG[day.getMonth()]));
  var list=el("div","daylist");
  S.kids.forEach(function(k){
    var e=L[k.id]||{}, t=k.tasks[wd]||{}, row=el("div","daykid");
    var im=el("img",""); im.src=avatarSrc(k); im.style.borderColor=k.colour; row.appendChild(im);
    row.appendChild(el("span","nm",esc(k.name)));
    bookingsOn(k.id, ds).forEach(function(bk){ row.appendChild(el("span","dbk",esc(bookingLabel(bk)))); });
    ["am","pm"].forEach(function(slot){
      if(!t[slot]) return;
      var done=inWeek?!!(S.done[k.id]&&S.done[k.id][wd+slot]):!!e[slot];
      var b=el("button","dtask"+(done?" done":"")+(inWeek?" nav":""),(slot==="am"?"☀️ ":"🌙 ")+esc(t[slot])+(done?" ✓":""));
      if(inWeek){ b.setAttribute("data-fid","dt-"+k.id+wd+slot); b.onclick=function(){ closeModal(); if(done) untick(k,wd+slot); else award(k,{type:"task",key:wd+slot}); }; }
      else b.disabled=true;
      row.appendChild(b);
    });
    if(e.bonus) row.appendChild(el("span","dtask done","⭐ +"+e.bonus+" bonus"));
    list.appendChild(row);
  });
  mt.appendChild(list);
  mt.appendChild(el("div","dnote",inWeek?"Choose a job to tick it (or untick it).":"Only this week's jobs can be ticked. Jobs shown are from the current job list."));
  var mb=document.getElementById("mbtns"); mb.innerHTML="";
  var cl=el("button","btn green nav","Close"); cl.onclick=closeModal; mb.appendChild(cl);
  document.querySelector("#modal .mbox").className="mbox wide";
  document.getElementById("modal").className="layer show";
  var f=list.querySelector(".nav")||cl; f.focus();
}

/* ---------- modal ---------- */
var modalReturn=null;
function confirmBox(html,btns){
  modalReturn=document.activeElement;
  document.getElementById("mtext").innerHTML=html; document.querySelector("#modal .mbox").className="mbox";
  var mb=document.getElementById("mbtns"); mb.innerHTML="";
  btns.forEach(function(b,i){ var x=el("button","btn nav "+b[1],b[0]); x.onclick=function(){ closeModal(); if(b[2]) b[2](); }; mb.appendChild(x); });

function loadPhoto(file,cb){
  var fr=new FileReader();
  fr.onload=function(){ var im=new Image(); im.onload=function(){ var s=Math.min(im.width,im.height), c=document.createElement("canvas"); c.width=c.height=256;
      // centre-ish square crop, biased slightly up (faces sit high in portraits)
      var sx=(im.width-s)/2, sy=Math.max(0,(im.height-s)*0.35);
      c.getContext("2d").drawImage(im,sx,sy,s,s,0,0,256,256); cb(c.toDataURL("image/jpeg",0.85)); };
    im.onerror=function(){ toast("Couldn't read that image"); }; im.src=fr.result; };
  fr.readAsDataURL(file);
}

/* ---------- TV remote / keyboard spatial navigation ---------- */
function activeRoot(){
  if(document.getElementById("modal").className.indexOf("show")>=0) return document.getElementById("modal");
  if(document.getElementById("settings").className.indexOf("show")>=0) return document.getElementById("settings");
  return document.getElementById("app");
}
function visibleNavs(root){
  return [].filter.call(root.querySelectorAll(".nav"),function(e){ if(e.disabled) return false; var r=e.getBoundingClientRect(); return r.width>0&&r.height>0; });
}
function moveFocus(dir){
  var root=activeRoot(), list=visibleNavs(root); if(!list.length) return;
  var cur=document.activeElement;
  if(!cur||list.indexOf(cur)<0){ var pref=root.querySelector(".cell.todaycol.nav:not(.done)")||list[0]; pref.focus(); return; }
  var r=cur.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, best=null, bs=1e12;
  list.forEach(function(e){ if(e===cur) return; var q=e.getBoundingClientRect(), x=q.left+q.width/2, y=q.top+q.height/2, dx=x-cx, dy=y-cy, main, cross;
    if(dir==="left"){ if(q.right>r.left+2&&dx>=-2) return; main=-dx; cross=Math.abs(dy); }
    else if(dir==="right"){ if(q.left<r.right-2&&dx<=2) return; main=dx; cross=Math.abs(dy); }
    else if(dir==="up"){ if(q.bottom>r.top+2&&dy>=-2) return; main=-dy; cross=Math.abs(dx); }
    else { if(q.top<r.bottom-2&&dy<=2) return; main=dy; cross=Math.abs(dx); }
    if(main<=0) return;
    var score=main+cross*2.2; if(score<bs){ bs=score; best=e; } });
  if(best){ best.focus(); if(best.scrollIntoView){ try{ best.scrollIntoView({block:"nearest",inline:"nearest"}); }catch(e){ best.scrollIntoView(false); } } }
}
document.addEventListener("keydown",function(e){
  var k=e.keyCode;
  if(anim){ if(k===13||k===27||k===10009||k===8||k===32){ e.preventDefault(); anim.stop(); } return; }
  var tgt=document.activeElement, isInput=tgt&&tgt.tagName==="INPUT";
  if(k===37||k===38||k===39||k===40){
    if(isInput&&(k===37||k===39)){ var v=tgt.value||"", p=tgt.selectionStart; if(!((k===37&&p===0)||(k===39&&p===v.length))) return; }
    e.preventDefault(); moveFocus({37:"left",38:"up",39:"right",40:"down"}[k]); return;
  }
  if(k===13&&isInput){ e.preventDefault(); moveFocus("down"); return; }
  if(k===10009||k===27||(k===8&&!isInput)){ // Samsung Back = 10009
    if(document.getElementById("modal").className.indexOf("show")>=0){ e.preventDefault(); closeModal(); }
    else if(document.getElementById("settings").className.indexOf("show")>=0){ e.preventDefault(); closeSettings(); }

});

/* private setup link: index.html#setup=Charlie~<base64 jpeg>[|Kid 2~<base64>][|bookings~<base64 json>]
   The hash never leaves the device (browsers don't send it to the server); photos and bookings are saved to this device's storage only. */
function kidIdForSetup(who){
  var w=String(who||"").trim().toLowerCase();
  if(!w||w==="all"||w==="family"||w==="whole family") return "all";
  if(w==="pippa") w="pip";
  var found=null;
  (S.kids||[]).forEach(function(k){
    var n=String(k.name||"").trim().toLowerCase();
    if(n==="pippa") n="pip";
    if(n===w) found=k;
  });
  return found?found.id:null;
}
function sameBooking(a,b){
  if(!a||!b) return false;
  if(a.id&&b.id&&a.id===b.id) return true;
  return (a.title||"")===(b.title||"")
    && padTime(a.time)===padTime(b.time)
    && a.kid===b.kid
    && (a.recur||"once")===(b.recur||"once")
    && (a.recur==="weekly"? +a.weekday===+b.weekday : a.date===b.date);
}
function bookingFromSetup(src){
  var kid=kidIdForSetup(src.who!=null?src.who:src.kid);
  if(!kid) return null;
  var rec={
    id:src.id,
    title:src.title,
    time:padTime(src.time),
    kid:kid,
    recur:src.recur==="weekly"?"weekly":"once",
    weekday:src.recur==="weekly"?(src.weekday==null?5:+src.weekday):null,
    date:src.recur==="weekly"?null:(src.date||null)
  };
  if(src.end) rec.end=padTime(src.end);
  return rec;
}
function mergeSetupBookings(extra){
  S.bookings=S.bookings||[];
  var list=extra||[], changed=false;
  list.forEach(function(src){
    var rec=bookingFromSetup(src); if(!rec||!rec.id) return;
    var i, found=false;
    for(i=0;i<S.bookings.length;i++){
      if(sameBooking(S.bookings[i],rec)){
        rec.id=rec.id||S.bookings[i].id;
        S.bookings[i]=rec;
        found=true; changed=true; break;
      }
    }
    if(!found){ S.bookings.push(rec); changed=true; }
  });
  return changed;
}
function bookingsFromHash(h){
  var out=[];
  h=h||""; if(h.indexOf("#setup=")!==0) return out;
  try{
    decodeURIComponent(h.slice(7)).split("|").forEach(function(part){
      var i=part.indexOf("~"); if(i<1) return;
      if(part.slice(0,i).trim().toLowerCase()!=="bookings") return;
      var b64=part.slice(i+1).replace(/\s/g,"").replace(/-/g,"+").replace(/_/g,"/");
      var data=JSON.parse(atob(b64));
      if(Array.isArray(data)) out=out.concat(data);
    });
  }catch(e){}
  return out;
}
function applySetup(){
  var h=location.hash||""; if(h.indexOf("#setup=")!==0) return;
  var extra=bookingsFromHash(h);
  var done=[];
  try{
    decodeURIComponent(h.slice(7)).split("|").forEach(function(part){
      var i=part.indexOf("~"); if(i<1) return;
      var name=part.slice(0,i).trim();
      if(name.toLowerCase()==="bookings") return;
      var b64=part.slice(i+1).replace(/\s/g,""); if(!/^[A-Za-z0-9+\/=_-]+$/.test(b64)) return;
      b64=b64.replace(/-/g,"+").replace(/_/g,"/");
      var k=null; S.kids.forEach(function(x){ if(x.name.toLowerCase()===name.toLowerCase()) k=x; });
      if(!k&&/^\d+$/.test(name)) k=S.kids[+name-1]||null;
      if(!k) return;
      k.photo="data:image/jpeg;base64,"+b64; done.push(k.name);
    });
  }catch(e){}
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash=""; }
  var bkChanged=mergeSetupBookings(extra);
  if(done.length||bkChanged){
    save();
    var msg=[];
    if(done.length) msg.push("Photo saved on this device for "+done.join(" & "));
    if(bkChanged) msg.push("Bookings saved on this device");
    setTimeout(function(){ toast(msg.join(". ")); },300);
  }
}
